<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard | FixMyHostel</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            background: #fff5f8;
            color: #382d33;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .dashboard-navbar {
            background: white;
            padding: 18px 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 10px #0000000a;
        }

        .logo {
            color: #d94679;
            font-size: 24px;
            font-weight: bold;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .dashboard-container {
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .page-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 30px;
        }

        .page-heading p {
            margin: 0;
            color: #806d76;
        }

        .dashboard-button {
            display: inline-block;
            border: none;
            border-radius: 9px;
            background: #e75480;
            color: white;
            padding: 12px 17px;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
        }

        .dashboard-button:hover {
            background: #ce3f6b;
        }

        .dashboard-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: white;
            padding: 23px;
            border-radius: 14px;
            box-shadow: 0 4px 15px #9e567010;
            border: 1px solid #f7e4eb;
        }

        .stat-card h3 {
            margin: 0 0 12px;
            font-size: 15px;
            color: #806d76;
            font-weight: 500;
        }

        .stat-card p {
            margin: 0;
            color: #d94679;
            font-size: 32px;
            font-weight: bold;
        }

        .complaints-section {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 4px 15px #9e567010;
            margin-bottom: 25px;
        }

        .section-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .section-heading h2 {
            margin: 0;
            font-size: 21px;
        }

        .complaint-filters {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 18px;
        }

        .complaint-filters input,
        .complaint-filters select,
        .feedback-form select,
        .feedback-form textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            border: 1px solid #ecd5df;
            border-radius: 8px;
            background: white;
            font: inherit;
        }

        .complaint-list {
            display: grid;
            gap: 16px;
        }

        .complaint-card {
            border: 1px solid #f0dce5;
            border-radius: 12px;
            padding: 18px;
            overflow-wrap: anywhere;
        }

        .complaint-card h3 {
            margin-top: 0;
        }

        .feature-tag {
            display: inline-block;
            margin: 3px 5px 8px 0;
            padding: 6px 10px;
            border-radius: 20px;
            background: #ffe5ee;
            color: #a62957;
            font-size: 13px;
        }

        .notification-wrap {
            position: relative;
        }

        #notificationButton {
            border: 1px solid #f0dce5;
            background: white;
            padding: 10px 13px;
            border-radius: 9px;
            cursor: pointer;
        }

        #notificationCount {
            display: inline-block;
            background: #d94679;
            color: white;
            border-radius: 20px;
            padding: 2px 7px;
            font-size: 12px;
        }

        #notificationPanel {
            display: none;
            position: absolute;
            right: 0;
            top: calc(100% + 8px);
            width: min(340px, 85vw);
            max-height: 350px;
            overflow-y: auto;
            background: white;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 5px 25px #0002;
            z-index: 10;
        }

        #notificationPanel.open {
            display: block;
        }

        .notification-item {
            padding: 10px 0;
            border-bottom: 1px solid #f3dce5;
            overflow-wrap: anywhere;
        }

        .notification-item p {
            margin: 5px 0;
        }

        .complaint-attachment {
            display: block;
            max-width: 100%;
            max-height: 320px;
            margin: 12px 0;
            border-radius: 10px;
        }

        .feedback-form {
            margin-top: 15px;
            padding: 15px;
            border: 1px solid #f4d5e1;
            border-radius: 10px;
            background: #fff6f9;
        }

        .feedback-form label {
            display: block;
            margin: 12px 0 6px;
        }

        .feedback-form button {
            margin-top: 12px;
        }

        .feature-message {
            margin: 12px 0;
        }

        .feature-error {
            color: #a51d38;
        }

        .feature-success {
            color: #17683b;
        }

        @media (max-width: 700px) {
            .dashboard-stats {
                grid-template-columns: 1fr;
            }

            .complaint-filters {
                grid-template-columns: 1fr;
            }

            .dashboard-navbar {
                padding: 15px 4%;
            }

            .logo {
                font-size: 19px;
            }

            .header-actions {
                gap: 6px;
            }

            .complaints-section {
                padding: 17px;
            }
        }
    </style>
</head>

<body>
    <nav class="dashboard-navbar">
        <div class="logo">FixMyHostel 💗</div>

        <div class="header-actions">
            <div class="notification-wrap">
                <button id="notificationButton" type="button">
                    🔔 <span id="notificationCount">0</span>
                </button>
                <div id="notificationPanel">
                    <strong>Your notifications</strong>
                    <div id="notificationList">Loading notifications...</div>
                </div>
            </div>

            <button class="dashboard-button" id="logoutButton" type="button">
                Logout
            </button>
        </div>
    </nav>

    <main class="dashboard-container">
        <section class="page-heading">
            <div>
                <h1>My Complaints</h1>
                <p id="studentInfo">Track your hostel complaints and their progress.</p>
            </div>

            <a href="raise-complaint.html" class="dashboard-button">
                + Raise Complaint
            </a>
        </section>

        <section class="dashboard-stats">
            <div class="stat-card">
                <h3>Total Complaints</h3>
                <p id="totalCount">0</p>
            </div>

            <div class="stat-card">
                <h3>Pending / In Progress</h3>
                <p id="pendingCount">0</p>
            </div>

            <div class="stat-card">
                <h3>Resolved</h3>
                <p id="resolvedCount">0</p>
            </div>
        </section>

        <section class="complaints-section">
            <div class="section-heading">
                <h2>Recent Complaints</h2>
            </div>

            <div class="complaint-filters">
                <input type="search" id="searchInput"
                    placeholder="Search complaints..."
                    aria-label="Search complaints">

                <select id="statusFilter" aria-label="Filter by status">
                    <option value="">All Statuses</option>
                    <option value="Submitted">Submitted</option>
                    <option value="Scheduled">Scheduled</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Resolved">Resolved</option>
                </select>

                <select id="categoryFilter" aria-label="Filter by category">
                    <option value="">All Categories</option>
                    <option value="Plumbing">Plumbing</option>
                    <option value="Electrical">Electrical</option>
                    <option value="Cleaning">Cleaning</option>
                    <option value="Wi-Fi">Wi-Fi</option>
                    <option value="Furniture">Furniture</option>
                    <option value="Other">Other</option>
                </select>

                <select id="priorityFilter" aria-label="Filter by priority">
                    <option value="">All Priorities</option>
                    <option value="Low">Low</option>
                    <option value="Medium">Medium</option>
                    <option value="High">High</option>
                    <option value="Urgent">Urgent</option>
                </select>
            </div>

            <button class="dashboard-button" id="clearFilters" type="button">
                Clear Filters
            </button>

            <div id="pageMessage" class="feature-message" role="status"></div>

            <div id="complaintList" class="complaint-list">
                <p>Loading your complaints...</p>
            </div>
        </section>
    </main>

    <script>
        const loggedInUser = JSON.parse(
            sessionStorage.getItem("loggedInUser") || "null"
        );

        const complaintList = document.getElementById("complaintList");
        const pageMessage = document.getElementById("pageMessage");
        let complaints = [];

        function addText(parent, tag, value, className = "") {
            const element = document.createElement(tag);
            element.textContent = value == null ? "" : String(value);
            if (className) element.className = className;
            parent.appendChild(element);
            return element;
        }

        function showMessage(message, type = "") {
            pageMessage.textContent = message;
            pageMessage.className = "feature-message " + type;
        }

        function normalize(value) {
            return String(value || "").toLowerCase().trim();
        }

        function setupProfile() {
            if (!loggedInUser || !loggedInUser.id) {
                window.location.href = "login.html";
                return false;
            }

            document.getElementById("studentInfo").textContent =
                "Welcome, " + (loggedInUser.name || "Student") +
                " · Student ID: " + (loggedInUser.user_id || "Not available");

            return true;
        }

        async function loadComplaints() {
            try {
                const response = await fetch(
                    "/complaints/student/" + encodeURIComponent(loggedInUser.id)
                );
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || "Could not load complaints.");
                }

                complaints = Array.isArray(data) ? data : (data.complaints || []);
                updateStats();
                renderComplaints();
            } catch (error) {
                complaintList.replaceChildren();
                addText(complaintList, "p", error.message, "feature-error");
            }
        }

        function updateStats() {
            document.getElementById("totalCount").textContent = complaints.length;
            document.getElementById("pendingCount").textContent =
                complaints.filter(c => c.status !== "Resolved").length;
            document.getElementById("resolvedCount").textContent =
                complaints.filter(c => c.status === "Resolved").length;
        }

        function getFilteredComplaints() {
            const search = normalize(document.getElementById("searchInput").value);
            const status = document.getElementById("statusFilter").value;
            const category = document.getElementById("categoryFilter").value;
            const priority = document.getElementById("priorityFilter").value;

            return complaints.filter(complaint => {
                const text = normalize([
                    complaint.complaint_id,
                    complaint.description,
                    complaint.category,
                    complaint.room_number
                ].join(" "));

                return (!search || text.includes(search)) &&
                    (!status || complaint.status === status) &&
                    (!category || complaint.category === category) &&
                    (!priority || (complaint.priority || "Medium") === priority);
            });
        }

        function renderComplaints() {
            complaintList.replaceChildren();
            const filtered = getFilteredComplaints();

            if (filtered.length === 0) {
                addText(
                    complaintList,
                    "p",
                    complaints.length
                        ? "No complaints match your search or filters."
                        : "You haven't raised any complaints yet."
                );
                return;
            }

            filtered.forEach(complaint => {
                const card = document.createElement("article");
                card.className = "complaint-card";

                addText(card, "h3", "Complaint #" + (complaint.complaint_id || ""));
                addText(card, "span", "Status: " + (complaint.status || "Submitted"), "feature-tag");
                addText(card, "span", "Priority: " + (complaint.priority || "Medium"), "feature-tag");

                addText(card, "p", "Category: " + (complaint.category || "Not specified"));
                addText(card, "p", "Room: " + (complaint.room_number || "Not specified"));
                addText(card, "p", "Description: " + (complaint.description || ""));
                addText(card, "p", "Preferred time: " + (complaint.preferred_time || "Not specified"));
                addText(card, "p", "Assigned worker: " +
                    (complaint.worker_name || complaint.assigned_worker_name || "Not assigned"));

                if (complaint.created_at) {
                    addText(card, "p", "Submitted: " + complaint.created_at);
                }

                if (complaint.attachment_path) {
                    const attachmentUrl = "/" +
                        String(complaint.attachment_path).replace(/^\/+/, "");
                    const type = String(complaint.attachment_type || "").toLowerCase();

                    if (type.startsWith("image/")) {
                        const image = document.createElement("img");
                        image.src = attachmentUrl;
                        image.alt = "Complaint attachment";
                        image.className = "complaint-attachment";
                        image.loading = "lazy";
                        card.appendChild(image);
                    } else if (type.startsWith("video/")) {
                        const video = document.createElement("video");
                        video.src = attachmentUrl;
                        video.controls = true;
                        video.preload = "metadata";
                        video.className = "complaint-attachment";
                        card.appendChild(video);
                    } else {
                        const link = document.createElement("a");
                        link.href = attachmentUrl;
                        link.textContent = "View attachment";
                        link.target = "_blank";
                        link.rel = "noopener noreferrer";
                        card.appendChild(link);
                    }
                }

                const detailsLink = document.createElement("a");
                detailsLink.href = "complaint-details.html?id=" +
                    encodeURIComponent(complaint.complaint_id);
                detailsLink.textContent = "View Details";
                detailsLink.className = "dashboard-button";
                card.appendChild(detailsLink);

                if (complaint.feedback_rating) {
                    addText(card, "p",
                        "Your rating: " + "★".repeat(Number(complaint.feedback_rating)) +
                        " (" + complaint.feedback_rating + "/5)",
                        "feature-success");

                    if (complaint.feedback_comment) {
                        addText(card, "p", "Your feedback: " + complaint.feedback_comment);
                    }
                } else if (complaint.status === "Resolved") {
                    createFeedbackForm(card, complaint);
                }

                complaintList.appendChild(card);
            });
        }

        function createFeedbackForm(card, complaint) {
            const form = document.createElement("form");
            form.className = "feedback-form";
            addText(form, "h3", "Rate your completed complaint ⭐");

            const ratingLabel = addText(form, "label", "Your rating");
            const rating = document.createElement("select");
            rating.required = true;

            const placeholder = document.createElement("option");
            placeholder.value = "";
            placeholder.textContent = "Choose a rating from 1 to 5";
            rating.appendChild(placeholder);

            [
                ["5", "★★★★★ - Excellent"],
                ["4", "★★★★ - Good"],
                ["3", "★★★ - Average"],
                ["2", "★★ - Poor"],
                ["1", "★ - Very poor"]
            ].forEach(([value, label]) => {
                const option = document.createElement("option");
                option.value = value;
                option.textContent = label;
                rating.appendChild(option);
            });

            ratingLabel.appendChild(rating);

            const commentLabel = addText(form, "label", "Comment (optional)");
            const comment = document.createElement("textarea");
            comment.maxLength = 1000;
            comment.placeholder = "Tell us about your experience...";
            commentLabel.appendChild(comment);

            const submit = document.createElement("button");
            submit.type = "submit";
            submit.className = "dashboard-button";
            submit.textContent = "Submit Feedback";
            form.appendChild(submit);

            const message = addText(form, "p", "");

            form.addEventListener("submit", async event => {
                event.preventDefault();

                if (!rating.value) {
                    message.textContent = "Please select a rating.";
                    message.className = "feature-error";
                    return;
                }

                submit.disabled = true;
                submit.textContent = "Submitting...";

                try {
                    const response = await fetch(
                        "/complaints/" + encodeURIComponent(complaint.complaint_id) + "/feedback",
                        {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                student_id: loggedInUser.id,
                                rating: Number(rating.value),
                                comment: comment.value.trim()
                            })
                        }
                    );

                    const result = await response.json();
                    if (!response.ok) {
                        throw new Error(result.message || "Could not submit feedback.");
                    }

                    showMessage("Thank you! Your feedback has been submitted.", "feature-success");
                    await loadComplaints();
                } catch (error) {
                    message.textContent = error.message;
                    message.className = "feature-error";
                    submit.disabled = false;
                    submit.textContent = "Submit Feedback";
                }
            });

            card.appendChild(form);
        }

        async function loadNotifications() {
            const list = document.getElementById("notificationList");
            const count = document.getElementById("notificationCount");

            try {
                const response = await fetch(
                    "/notifications/" + encodeURIComponent(loggedInUser.id)
                );

                if (!response.ok) throw new Error("Could not load notifications.");

                const data = await response.json();
                const notifications = Array.isArray(data) ? data : (data.notifications || []);

                count.textContent = notifications.filter(n => !n.is_read).length;
                list.replaceChildren();

                if (notifications.length === 0) {
                    addText(list, "p", "No notifications yet.");
                    return;
                }

                notifications.forEach(notification => {
                    const item = document.createElement("div");
                    item.className = "notification-item";
                    addText(item, "p", notification.message || "");

                    if (notification.created_at) {
                        addText(item, "small", notification.created_at);
                    }

                    if (!notification.is_read) {
                        const button = document.createElement("button");
                        button.type = "button";
                        button.textContent = "Mark as read";
                        button.addEventListener("click", () => markNotificationRead(notification.id));
                        item.appendChild(button);
                    } else {
                        addText(item, "small", "Read");
                    }

                    list.appendChild(item);
                });
            } catch (error) {
                list.replaceChildren();
                addText(list, "p", error.message, "feature-error");
            }
        }

        async function markNotificationRead(notificationId) {
            try {
                const response = await fetch(
                    "/notifications/" + encodeURIComponent(notificationId) + "/read",
                    { method: "PATCH" }
                );

                if (!response.ok) throw new Error("Could not mark notification as read.");
                await loadNotifications();
            } catch (error) {
                showMessage(error.message, "feature-error");
            }
        }

        document.getElementById("notificationButton").addEventListener("click", () => {
            document.getElementById("notificationPanel").classList.toggle("open");
        });

        document.addEventListener("click", event => {
            const wrap = document.querySelector(".notification-wrap");
            if (!wrap.contains(event.target)) {
                document.getElementById("notificationPanel").classList.remove("open");
            }
        });

        document.getElementById("logoutButton").addEventListener("click", () => {
            sessionStorage.removeItem("loggedInUser");
            window.location.href = "login.html";
        });

        ["searchInput", "statusFilter", "categoryFilter", "priorityFilter"].forEach(id => {
            document.getElementById(id).addEventListener("input", renderComplaints);
            document.getElementById(id).addEventListener("change", renderComplaints);
        });

        document.getElementById("clearFilters").addEventListener("click", () => {
            document.getElementById("searchInput").value = "";
            document.getElementById("statusFilter").value = "";
            document.getElementById("categoryFilter").value = "";
            document.getElementById("priorityFilter").value = "";
            renderComplaints();
        });

        if (setupProfile()) {
            loadComplaints();
            loadNotifications();
            setInterval(loadNotifications, 30000);
        }
    </script>
</body>
</html>
